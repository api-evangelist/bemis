x-domain-note: bemis.com (CSC Corporate Domains, registered 1995) 301s to https://www.amcor.com,
  the acquirer, so Amcor's site is the Website of record. www.bemisus.com, previously wired here
  as "Bemis Healthcare Packaging", was registered 2025-12-22 via Dynadot, six years after the
  merger, carries a fictional +1-800-555-0100 contact number and obfuscated healthcare@bemis.com
  addresses on a bemis.com domain it does not control, and is NOT a Bemis or Amcor property. It
  was removed as a Website pointer on 2026-09-19 and is deliberately not wired.
specificationVersion: '0.23'
description: >-
  Bemis Company, Inc. was a global manufacturer of flexible packaging for food,
  beverage, personal care and healthcare markets. Founded in 1858 and headquartered
  in Neenah, Wisconsin, it completed a $6.8 billion all-stock merger with Amcor
  Limited on 11 June 2019 and was fully absorbed into Amcor: bemis.com now 301s to
  www.amcor.com and the Bemis businesses, including its healthcare packaging unit,
  operate as Amcor Flexibles. Bemis never ran a developer program, and no public API
  surface exists to profile; www.bemisus.com, which presents itself as Bemis, is an
  unrelated domain registered in December 2025.
