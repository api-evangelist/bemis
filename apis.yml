  - type: Features
    data:
      - name: Flexible Packaging Manufacturing
        description: >-
          Bemis/Amcor manufactures flexible packaging solutions for food, beverage,
          personal care, and pharmaceutical markets, including pouches, films, bags,
          and lidding materials.
      - name: Healthcare and Pharmaceutical Packaging
        description: >-
          FDA-compliant packaging solutions for medical devices, pharmaceuticals,
          and diagnostics, manufactured under ISO 13485 and ISO 9001 quality
          management systems.
      - name: Sustainable Packaging
        description: >-
          Bemis and Amcor invest in recyclable, compostable, and reduced-material
          packaging innovations as part of the combined company's sustainability
          commitments.
      - name: Global Manufacturing Network
        description: >-
          The combined Bemis/Amcor manufacturing network spans 40+ countries with
          hundreds of manufacturing facilities serving consumer goods companies,
          retailers, and pharmaceutical manufacturers worldwide.
  - type: UseCases
    data:
      - name: Food and Beverage Packaging
        description: >-
          Flexible packaging for snack foods, dairy, frozen foods, beverages, and
          other consumer food products requiring barrier properties, shelf-life
          extension, and retail presentation.
      - name: Pharmaceutical and Medical Device Packaging
        description: >-
          FDA-registered, ISO-certified flexible packaging for pharmaceuticals,
          medical devices, and diagnostic products requiring sterile barrier
          protection and regulatory compliance.
      - name: Personal Care Packaging
        description: >-
          Flexible packaging and films for cosmetics, personal care, and household
          product brands requiring printability, material compatibility, and
          supply chain efficiency.
  - type: Integrations
    data:
      - name: Amcor
        description: >-
          Bemis Company completed its merger with Amcor Limited in June 2019 in
          a $6.8 billion all-stock transaction, creating a single global packaging
          leader operating under the Amcor brand.
